<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Предложение за SKV Cargo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column on a faint grid; nesting of bordered panels carries the hierarchy, the black "ink" panel marks the core module. */
:root {
  --bg: #ffffff;
  --grid: rgba(3, 7, 18, 0.045);
  --surface: #ffffff;
  --surface-2: #f9fafb;
  --surface-3: #f3f4f6;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --fg: #030712;
  --fg-2: #374151;
  --fg-3: #6b7280;
  --lime: #76b900;
  --lime-bright: #b2f526;
  --lime-soft: #f0ffc7;
  --lime-ink: #3a580f;
  --ink-bg: #030712;
  --ink-fg: #ffffff;
  --ink-2: #9ca3af;
  --ink-line: rgba(255, 255, 255, 0.12);
  --ink-chip: rgba(255, 255, 255, 0.07);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --grid: rgba(255, 255, 255, 0.04); --surface: #111113; --surface-2: #18181b; --surface-3: #232326;
    --line: #27272a; --line-strong: #3f3f46; --fg: #fafafa; --fg-2: #d4d4d8; --fg-3: #a1a1aa;
    --lime: #b2f526; --lime-bright: #b2f526; --lime-soft: #1d3201; --lime-ink: #e0ff95;
    --ink-bg: #16210a; --ink-fg: #fafafa; --ink-2: #b7c4a0; --ink-line: rgba(178, 245, 38, 0.22); --ink-chip: rgba(178, 245, 38, 0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --grid: rgba(255, 255, 255, 0.04); --surface: #111113; --surface-2: #18181b; --surface-3: #232326;
  --line: #27272a; --line-strong: #3f3f46; --fg: #fafafa; --fg-2: #d4d4d8; --fg-3: #a1a1aa;
  --lime: #b2f526; --lime-bright: #b2f526; --lime-soft: #1d3201; --lime-ink: #e0ff95;
  --ink-bg: #16210a; --ink-fg: #fafafa; --ink-2: #b7c4a0; --ink-line: rgba(178, 245, 38, 0.22); --ink-chip: rgba(178, 245, 38, 0.08);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 20px;
  padding-block: 40px 72px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: -0.02em; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink-bg); display: grid; place-items: center; }
.brand-mark i { width: 10px; height: 10px; border-radius: 3px; background: var(--lime-bright); transform: rotate(45deg); }
.brand b { font-weight: 700; }
.brand span { font-weight: 400; color: var(--fg-2); }

.hero { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--lime-soft); color: var(--lime-ink); }
h1 { font-size: clamp(30px, 5.2vw, 46px); line-height: 1.08; letter-spacing: -0.035em; font-weight: 600; text-wrap: balance; }
h1 em { font-style: normal; color: var(--lime); }
.lead { color: var(--fg-2); max-width: 62ch; font-size: 16px; }

.section { display: flex; flex-direction: column; gap: 20px; }
.section-head { display: flex; flex-direction: column; gap: 6px; }
h2 { font-size: 24px; letter-spacing: -0.025em; font-weight: 600; }
.section-head p { color: var(--fg-3); max-width: 65ch; }

.route { font-family: var(--mono); font-size: 12px; color: var(--fg-3); background: var(--surface-3); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.panel { border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.panel.inner { background: var(--surface); border-color: var(--line-strong); border-radius: 16px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.panel-head h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.panel-head .route { margin-left: auto; }
.level { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); }

.modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.module { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.module h4 { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.module-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.module-head p { font-size: 13px; color: var(--fg-3); }
.module-head .route { margin-left: auto; }
.items { display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--fg-2); }
.items li { display: flex; align-items: center; gap: 8px; }
.items li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--lime); flex: none; }
kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--fg-3); white-space: nowrap; }

.module.core { grid-column: 1 / -1; background: var(--ink-bg); border-color: var(--ink-bg); color: var(--ink-fg); padding: 22px; gap: 18px; }
.core .module-head p { color: var(--ink-2); }
.core .route { background: var(--ink-chip); color: var(--ink-2); }
.core-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.core-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding-top: 14px; border-top: 1px solid var(--ink-line); }
.core-col h5 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lime-bright); }
.core .items { color: var(--ink-fg); }
.core .items li::before { background: var(--lime-bright); }
.core kbd { border-color: var(--ink-line); color: var(--ink-2); }

.flow { display: flex; flex-direction: column; align-items: stretch; }
.steps { display: flex; flex-direction: column; align-items: center; }
.step { width: min(100%, 420px); border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); padding: 14px 18px; display: flex; gap: 14px; align-items: center; }
.step-n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink-bg); color: var(--lime-bright); display: grid; place-items: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.step h4 { font-size: 15px; font-weight: 600; }
.step p { font-size: 13px; color: var(--fg-3); }
.link { width: 1px; height: 26px; background: var(--line-strong); position: relative; }
.link::after { content: ""; position: absolute; left: -4px; bottom: 0; width: 7px; height: 7px; border-right: 1px solid var(--fg-3); border-bottom: 1px solid var(--fg-3); transform: rotate(45deg); }
.branch-label { font-size: 12px; color: var(--fg-3); padding: 6px 0; text-align: center; }
.branches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--line-strong); padding-top: 14px; }
.branch { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: 14px 16px; min-width: 0; }
.branch.core-b { background: var(--ink-bg); border-color: var(--ink-bg); color: var(--ink-fg); }
.branch h4 { font-size: 15px; font-weight: 600; }
.branch p { font-size: 13px; color: var(--fg-3); }
.branch.core-b p { color: var(--ink-2); }
.cycle-wrap { margin-top: 14px; border: 1px dashed var(--lime); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cycle-wrap > p { font-size: 13px; color: var(--fg-3); }
.cycle-wrap > p b { color: var(--fg); font-weight: 600; }
.cycle { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
.cycle li { position: relative; border-radius: 12px; background: var(--lime-soft); color: var(--lime-ink); padding: 12px 14px; min-width: 0; }
.cycle li b { display: block; font-size: 14px; font-weight: 600; }
.cycle li span { font-size: 12px; opacity: 0.85; }
.cycle li:not(:last-child)::after { content: "→"; position: absolute; right: -18px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-size: 14px; }

.extras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.extra { border-top: 2px solid var(--fg); padding-top: 12px; min-width: 0; }
.extra h4 { font-size: 15px; font-weight: 600; }
.extra p { font-size: 13px; color: var(--fg-3); }
.extra .route { display: inline-block; margin-top: 8px; }
footer { font-size: 12px; color: var(--fg-3); border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 760px) {
  .modules, .core-cols, .branches, .extras { grid-template-columns: minmax(0, 1fr); }
  .cycle { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .cycle li:not(:last-child)::after { content: none; }
  .panel { padding: 14px; }
  .panel-head .route, .module-head .route { margin-left: 0; }
  .branches { border-top: 0; padding-top: 0; }
}

/* ---- proposal pages ---- */
:root { --amber: #b45309; --amber-soft: #fef3c7; --blue: #1d4ed8; --blue-soft: #dbeafe; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --amber: #fbbf24; --amber-soft: #3a2a06; --blue: #93c5fd; --blue-soft: #14233f; } }
:root[data-theme="dark"] { --amber: #fbbf24; --amber-soft: #3a2a06; --blue: #93c5fd; --blue-soft: #14233f; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.topbar { max-width: 1040px; margin: 0 auto 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.topbar .brand { text-decoration: none; }
.topnav { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.topnav a { font-size: 13px; font-weight: 500; text-decoration: none; padding: 6px 14px; border-radius: 999px; color: var(--fg-2); }
.topnav a:hover { background: var(--surface-3); }
.topnav a[aria-current="page"] { background: var(--ink-bg); color: var(--ink-fg); }
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.principle { border-top: 2px solid var(--fg); padding-top: 14px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.principle h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.principle p { color: var(--fg-2); font-size: 14px; }
.cover { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.cover-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; }
.cover-bar i { display: block; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.s-have { background: var(--lime); }
.s-partial { background: var(--amber); }
.s-new { background: var(--fg); }
.s-check { background: var(--blue); }
.s-deal { background: var(--line-strong); }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: ph; }
.phases li { counter-increment: ph; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.phases li::before { content: counter(ph); width: 26px; height: 26px; border-radius: 50%; background: var(--ink-bg); color: var(--lime-bright); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.phases b { font-size: 15px; font-weight: 600; }
.phases span { font-size: 13px; color: var(--fg-3); }
.jump { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; background: var(--ink-bg); color: var(--ink-fg); border-radius: 20px; padding: 28px; text-decoration: none; }
.jump h2 { color: var(--ink-fg); }
.jump p { color: var(--ink-2); max-width: 52ch; margin-top: 6px; }
.jump .go { flex: none; background: var(--lime-bright); color: #1d3201; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; }
.jump:hover .go { filter: brightness(1.06); }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px; text-decoration: none; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .15s; }
.cat:hover { border-color: var(--fg); }
.cat-top { display: flex; align-items: baseline; gap: 10px; }
.cat-top h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.cat-top span { margin-left: auto; font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.cat p { font-size: 13px; color: var(--fg-3); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.asks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
.asks li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--fg-2); padding: 8px 0; border-bottom: 1px solid var(--line); }
.asks li::before { content: ""; width: 10px; height: 10px; border: 1.5px solid var(--fg-3); border-radius: 3px; flex: none; transform: translateY(1px); }
.lanes { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-x: auto; }
.lane { display: flex; align-items: center; gap: 8px; min-width: max-content; }
.lane-name { width: 84px; flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.node { font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface-2); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.arrow { color: var(--fg-3); font-size: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-2); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink-bg); border-color: var(--ink-bg); color: var(--ink-fg); }
.req-cat { scroll-margin-top: 20px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px 32px; padding-top: 24px; border-top: 1px solid var(--line-strong); }
.req-cat header { display: flex; flex-direction: column; gap: 6px; }
.req-cat h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.req-cat header p { font-size: 13px; color: var(--fg-3); }
.reqs { display: flex; flex-direction: column; gap: 8px; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
.req b { font-size: 14px; font-weight: 500; }
.req small { grid-column: 1; font-size: 13px; color: var(--fg-3); }
.badge { grid-row: 1; grid-column: 2; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; }
.empty { font-size: 13px; color: var(--fg-3); padding: 6px 0; }
@media (max-width: 760px) {
  .principles, .phases, .cats, .asks { grid-template-columns: minmax(0, 1fr); }
  .req-cat { grid-template-columns: minmax(0, 1fr); }
  .jump { padding: 20px; }
  .topbar { margin-bottom: 28px; }
}
</style>
<style>
[hidden] { display: none !important; }
body { margin: 0; }
.lock { min-height: 70vh; display: grid; place-items: center; }
.lock-card { width: min(100%, 400px); border: 1px solid var(--line-strong); border-radius: 20px; background: var(--surface); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.lock-card h1 { font-size: 22px; letter-spacing: -0.025em; }
.lock-card p { color: var(--fg-2); font-size: 14px; }
.lock-card label { font-size: 13px; font-weight: 500; color: var(--fg-2); display: flex; flex-direction: column; gap: 6px; }
.lock-card input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); }
.lock-card input:focus-visible { outline: 2px solid var(--lime); outline-offset: 1px; }
.lock-card button { font: inherit; font-weight: 600; font-size: 14px; padding: 11px 18px; border-radius: 999px; border: 0; background: var(--ink-bg); color: var(--ink-fg); cursor: pointer; }
.lock-card button[disabled] { opacity: 0.6; cursor: default; }
.lock-err { color: #b91c1c; font-size: 13px; min-height: 18px; }
</style>
<div class="lock" id="vx-lock">
  <form class="lock-card" id="vx-form" autocomplete="off">
    <div class="brand"><div class="brand-mark"><i></i></div><div><b>ViX</b><span>Rate</span></div></div>
    <h1>Защитен документ</h1>
    <p>Въведете паролата, за да отворите предложението.</p>
    <label for="vx-pass">Парола<input id="vx-pass" type="password" required autofocus></label>
    <div class="lock-err" id="vx-err" role="alert"></div>
    <button type="submit" id="vx-go">Отвори</button>
  </form>
</div>
<div id="vx-app" hidden></div>

  var lock = document.getElementById('vx-lock'), app = document.getElementById('vx-app');
  var form = document.getElementById('vx-form'), input = document.getElementById('vx-pass');
  var err = document.getElementById('vx-err'), go = document.getElementById('vx-go');
  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function text(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function open(raw) {
    var d = bytes(DATA);
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12)); })

        var t = document.createElement('template');
        t.innerHTML = new TextDecoder().decode(buf);
        app.appendChild(t.content);
        lock.hidden = true; app.hidden = false;
        Array.prototype.forEach.call(app.querySelectorAll('script'), function (old) {
          var n = document.createElement('script'); n.textContent = old.textContent; old.replaceWith(n);
        });
      });
  }
  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(SALT), iterations: ITER }, k, 256); })
      .then(function (b) { return new Uint8Array(b); });

  if (saved) open(bytes(saved)).catch(function () { try { sessionStorage.removeItem('vx-key'); } catch (e) {} });
