<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Сметкоплан и склад</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500&display=swap">
<style>
/* Layout: three lanes (аналитичност · сметкоплан · склад) over a bottom band for the posting, connectors drawn behind the cards */
:root {
  --bg: #f3f6f9;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #17202b;
  --muted: #5b6979;
  --rule: #d6dde5;
  --acct: #1d5cc0;
  --acct-soft: #e6eefb;
  --dim: #a35f00;
  --dim-soft: #fbf0df;
  --wh: #2a7a4b;
  --wh-soft: #e3f3e9;
  --struct: #8794a3;
  --par: #7b3fae;
  --par-soft: #f2e9fa;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #151c24; --surface-2: #1a222c; --ink: #e5ecf3; --muted: #93a2b2; --rule: #2a3542;
    --acct: #77abff; --acct-soft: #1a2a44; --dim: #f0a845; --dim-soft: #35270f; --wh: #63c78f; --wh-soft: #14301f; --struct: #5f6d7d; --par: #c59cf0; --par-soft: #2c1e3e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a222c; --ink: #e5ecf3; --muted: #93a2b2; --rule: #2a3542;
  --acct: #77abff; --acct-soft: #1a2a44; --dim: #f0a845; --dim-soft: #35270f; --wh: #63c78f; --wh-soft: #14301f; --struct: #5f6d7d; --par: #c59cf0; --par-soft: #2c1e3e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
}
.page {
  max-width: 1240px; margin: 0 auto;
  padding-block: 36px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
header { display: grid; gap: 10px; max-width: 760px; }
h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); font-size: 15px; }
h2 { font-size: 18px; margin: 0; font-weight: 600; text-wrap: balance; }

/* Controls */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.scenes { display: flex; flex-wrap: wrap; gap: 8px; }
.scene {
  font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.scene:hover { border-color: var(--muted); }
.scene[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scene:focus-visible, .node:focus-visible { outline: 2px solid var(--acct); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { flex: none; }

.caption {
  min-height: 48px; padding: 12px 16px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--rule); color: var(--muted); font-size: 13.5px;
}
.caption strong { color: var(--ink); font-weight: 600; }
.caption ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 2px; }

/* Diagram */
.diagram { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 64px; row-gap: 40px; }
.diagram > svg.wires, .diagram > svg.labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.diagram > svg.labels { z-index: 2; }
.lane, .band-cell { position: relative; z-index: 1; display: grid; gap: 12px; align-content: start; min-width: 0; }
.lane-head { display: grid; gap: 2px; padding-bottom: 4px; }
.lane-head .eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.lane-head .sub { font-size: 12.5px; color: var(--muted); }
.lane[data-kind="dim"] .eyebrow, .band-cell[data-kind="dim"] .eyebrow { color: var(--dim); }
.lane[data-kind="acct"] .eyebrow, .band-cell[data-kind="acct"] .eyebrow { color: var(--acct); }
.lane[data-kind="wh"] .eyebrow, .band-cell[data-kind="wh"] .eyebrow { color: var(--wh); }
.band-cell[data-kind="je"] .eyebrow { color: var(--ink); }

.band-label {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; z-index: 1;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted);
  margin-bottom: -20px;
}
.band-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.card-head { padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.table { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }

.node {
  position: relative; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline;
  padding: 7px 12px; background: var(--surface); cursor: default;
  transition: opacity .15s, background-color .15s;
}
.card > .node + .node { border-top: 1px solid var(--rule); }
.node .code { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.node .name { font-weight: 500; min-width: 0; }
.node .meta { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.node.root .name { font-weight: 600; }
.node.l1 { padding-left: 28px; }
.node.l2 { padding-left: 46px; }
.node.l1::before, .node.l2::before {
  content: ""; position: absolute; top: 0; bottom: 50%; width: 9px; border-left: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.node.l1::before { left: 16px; }
.node.l2::before { left: 34px; }
.node.head { background: var(--surface-2); }

.pill { font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.pill.acct { background: var(--acct-soft); color: var(--acct); }
.pill.dim { background: var(--dim-soft); color: var(--dim); }
.pill.wh { background: var(--wh-soft); color: var(--wh); }
.pill.par { background: var(--par-soft); color: var(--par); }
.pill.cat { background: transparent; color: var(--muted); border: 1px solid var(--rule); }

.amount { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.side { font-family: var(--f-mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--rule); }

.card[data-kind="dim"] { border-top: 3px solid var(--dim); }
.card[data-kind="acct"] { border-top: 3px solid var(--acct); }
.card[data-kind="wh"] { border-top: 3px solid var(--wh); }
.card[data-kind="par"] { border-top: 3px solid var(--par); }
.lane-head.par .eyebrow { color: var(--par); }
.card[data-kind="je"] { border-top: 3px solid var(--ink); }

/* Wires */
.wire { fill: none; stroke-width: 1.6; transition: opacity .15s, stroke-width .15s; }
.wire.acct { stroke: var(--acct); }
.wire.dim { stroke: var(--dim); stroke-dasharray: 5 4; }
.wire.wh { stroke: var(--wh); }
.wire.par { stroke: var(--par); }
.wire.struct { stroke: var(--struct); stroke-dasharray: 2 3; }
.dot { stroke: none; }
.dot.acct { fill: var(--acct); } .dot.dim { fill: var(--dim); } .dot.wh { fill: var(--wh); } .dot.struct { fill: var(--struct); } .dot.par { fill: var(--par); }
.wire-label { opacity: 0; transition: opacity .15s; }
.wire-label text { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; }
.wire-label rect { fill: var(--surface); stroke-width: 1; }
.wire-label.acct text { fill: var(--acct); } .wire-label.dim text { fill: var(--dim); } .wire-label.wh text { fill: var(--wh); } .wire-label.struct text { fill: var(--muted); } .wire-label.par text { fill: var(--par); }
.wire-label.acct rect { stroke: var(--acct); } .wire-label.dim rect { stroke: var(--dim); } .wire-label.wh rect { stroke: var(--wh); } .wire-label.struct rect { stroke: var(--struct); } .wire-label.par rect { stroke: var(--par); }

.diagram.focus .node:not(.on) { opacity: .32; }
.diagram.focus .node.on { background: var(--surface-2); }
.diagram.focus .wire:not(.on), .diagram.focus .dot:not(.on) { opacity: .08; }
.diagram.focus .wire.on { stroke-width: 2.4; }
.diagram.focus .wire-label.on { opacity: 1; }

/* Notes and relation table */
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.note { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.note h3 { margin: 0; font-size: 15px; font-weight: 600; }
.note p, .note ul { margin: 0; color: var(--muted); font-size: 13.5px; }
.note ul { padding-left: 18px; display: grid; gap: 4px; }
.note code, td code { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }


@media (max-width: 920px) {
  .diagram { grid-template-columns: minmax(0, 1fr); row-gap: 28px; }
  .diagram > svg.wires, .diagram > svg.labels { display: none; }
  .band-label { margin-bottom: -12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>


<style>
.gate { min-height: 70vh; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 48px; }
.gate form { width: 100%; max-width: 340px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--acct); border-radius: 10px; padding: 24px; }
.gate h1 { font-size: 20px; }
.gate p { margin: 0; color: var(--muted); font-size: 13.5px; }
.gate label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.gate input { font: inherit; font-size: 18px; letter-spacing: 0.3em; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink); width: 100%; }
.gate input:focus-visible, .gate button:focus-visible { outline: 2px solid var(--acct); outline-offset: 2px; }
.gate button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
.gate button[disabled] { opacity: .6; cursor: progress; }
.gate .err { color: #c0392b; font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gate-form" autocomplete="off">
    <h1>Сметкоплан, аналитичност и склад</h1>
    <p>Страницата е защитена. Въведете паролата, за да я видите.</p>
    <div style="display:grid;gap:6px">
      <label for="gate-pass">Парола</label>
      <input id="gate-pass" type="password" inputmode="numeric" autofocus required>
    </div>
    <div class="err" id="gate-err" aria-live="polite"></div>
    <button type="submit" id="gate-btn">Отвори</button>
  </form>
</div>
<div id="app"></div>
